name: HTML Website CI/CD

on:
  push:
    branches:
      - main

jobs:

  # --------------------
  # CI
  # --------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/my-website:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/my-website:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-website:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-website:latest


  # --------------------
  # CD
  # --------------------
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-website:${{ github.sha }}

            docker stop my-website || true
            docker rm my-website || true

            docker run -d \
              --name my-website \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/my-website:${{ github.sha }}
